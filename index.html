<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAFD MATES</title>
<style>
:root{--bg:#eef5f1;--ink:#12302a;--mut:#54706a;--card:#ffffff;--line:#cfdcd5;--accent:#0f6b5c;--hot:#e0a100;--onacc:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Georgia,"Times New Roman",serif}
h1,h2,h3,nav,button,input,select,th{font-family:"Trebuchet MS",Verdana,sans-serif}
header{position:sticky;top:0;background:var(--accent);color:var(--onacc);z-index:5}
.bar{max-width:1000px;margin:auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.logo{font:800 22px "Trebuchet MS",sans-serif;letter-spacing:.5px}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{color:inherit;text-decoration:none;padding:6px 12px;border-radius:20px;font-size:15px;cursor:pointer}
nav a.on,nav a:hover{background:var(--onacc);color:var(--accent)}
main{max-width:1000px;margin:auto;padding:28px 16px 60px}
.page{display:none}.page.on{display:block}
h1{font-size:clamp(34px,7vw,64px);line-height:1.05;margin:.2em 0}
h2{font-size:28px;margin:0 0 12px}
p{max-width:65ch}
.hero{padding:30px 0;border-bottom:4px solid var(--hot)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:130px;display:flex;align-items:flex-end;color:var(--mut)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:var(--onacc);font-size:14px}
.wrap{overflow-x:auto}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:420px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
input,select{padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:15px;width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:14px 0}
button{padding:10px 16px;border:0;border-radius:6px;background:var(--accent);color:var(--onacc);font-weight:700;cursor:pointer;font-size:15px}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.on{outline:3px solid var(--hot)}
button.del{padding:4px 10px;background:#b3261e;color:#fff}
.err{color:#b3261e;min-height:1.4em;margin:6px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tag{background:var(--hot);color:#1d2a2a;padding:2px 10px;border-radius:12px;font:700 13px "Trebuchet MS",sans-serif}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
#gate{position:fixed;inset:0;background:#0f6b5c;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#gate .box{max-width:380px;width:100%}
#gate h1{font-size:34px;margin:0 0 6px}
body.locked header,body.locked main{display:none}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.person{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:center;padding-bottom:12px}
.person img,.person .ph{width:100%;aspect-ratio:1;object-fit:cover;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut);font:700 40px "Trebuchet MS",sans-serif}
.person h3{margin:10px 8px 0;font-size:17px}.person p{margin:2px 8px 8px;color:var(--mut);font-size:14px}
.pwwrap{position:relative}
.pwwrap input{padding-right:46px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:6px 8px;background:transparent;color:var(--mut);border-radius:6px;line-height:0}
.eye svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tagline{font:700 14px/1.4 "Trebuchet MS",sans-serif;letter-spacing:1.5px;color:var(--accent);margin:0 0 14px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.shot{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.shot img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.shot .del{position:absolute;top:8px;right:8px}
.hub{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--hot);border-radius:10px;margin:0 0 16px;overflow:hidden}
.hub h3{margin:0;padding:12px 14px;font-size:19px}
.hub table{border:0;border-radius:0}
.vac td{color:var(--mut);font-style:italic}
.pos{font:700 12px "Trebuchet MS",sans-serif;background:var(--accent);color:var(--onacc);padding:2px 8px;border-radius:10px}
.clubrow td{background:var(--bg);font:700 14px "Trebuchet MS",sans-serif;color:var(--accent)}
.hubadd{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;max-width:420px}
.hubadd input{flex:1;min-width:160px}
.logo-img{height:44px;width:auto;background:#fff;border-radius:6px;display:block}
.logo{display:flex;align-items:center;gap:10px}
.gatelogo{display:block;width:150px;max-width:50%;margin:0 auto 10px}
.herologo{width:min(240px,60%);display:block;margin:0 0 6px}
#gate .box{text-align:center}
#gate .row{justify-content:center}
#gate .pwwrap{text-align:left}
</style>
</head>

<h1>WAFD MATES</h1><p class="tagline">WHOLE HEARTED ACTIVE FRIENDS FOR DA'WA</p></div></section>


<section class="page" id="gallery"><div id="galBox"></div></section>

</main>

<script>
const PASS={ADMIN:"sirusiraj",MEMBERS:"members.com"};
let role=null; // set after sign in
const SB_URL="", SB_KEY=""; // paste your Supabase Project URL and anon key here
const CLOUD=!!(SB_URL&&SB_KEY), SB_KEYS=["sub2","hubs","core","gallery","members"];
const SBH={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};
const mem={};let curPage="home";
function setSync(t){const e=document.getElementById("sync");if(e)e.textContent=t}
const store={
  get(k){
    if(k in mem)return JSON.parse(JSON.stringify(mem[k]));
    try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return []}
  },
  set(k,v){
    mem[k]=v;let ok=false;
    try{localStorage.setItem(k,JSON.stringify(v));ok=true}catch(e){}
    if(CLOUD){
      ok=true;
      fetch(SB_URL+"/rest/v1/kv",{method:"POST",headers:{...SBH,Prefer:"resolution=merge-duplicates"},body:JSON.stringify({key:k,value:v})})
        .then(r=>setSync(r.ok?"Saved online for everyone.":"Could not save online. Check your connection.")).catch(()=>setSync("Could not save online. Check your connection."));
    }
    return ok;
  }
};
async function syncCloud(){
  if(!CLOUD){setSync("Saved on this device only.");return}
  try{
    const r=await fetch(SB_URL+"/rest/v1/kv?select=key,value",{headers:SBH});
    if(!r.ok)throw 0;
    const rows=await r.json(),seen={};
    rows.forEach(x=>{seen[x.key]=1;mem[x.key]=x.value;try{localStorage.setItem(x.key,JSON.stringify(x.value))}catch(e){}});
    SB_KEYS.forEach(k=>{if(!seen[k]){const l=store.get(k);if(l.length)store.set(k,l)}});
    setSync("Connected. Saved online for everyone.");
    show(curPage);
  }catch(e){setSync("Online storage not reachable. Showing this device's data.")}
}
try{role=sessionStorage.getItem("wafdRole")}catch(e){}


const EYE='<svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg viewBox="0 0 24 24"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 5.1A10.4 10.4 0 0 1 12 5c7 0 11 7 11 7a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function addEye(inp){
  const w=document.createElement("div");w.className="pwwrap";
  inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
  const b=document.createElement("button");b.type="button";b.className="eye";
  b.setAttribute("aria-label","Show password");b.innerHTML=EYE;
  b.onclick=()=>{const hide=inp.type==="password";inp.type=hide?"text":"password";b.innerHTML=hide?EYEOFF:EYE;b.setAttribute("aria-label",hide?"Hide password":"Show password")};
  w.appendChild(b);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function show(p){
  if(!document.getElementById(p))p="home";
  curPage=p;
  document.querySelectorAll(".page").forEach(e=>e.classList.toggle("on",e.id===p));
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.p===p));
  if(p==="gallery")renderAny("gallery","galBox","Gallery");
  if(p==="core")renderAny("core","coreBox","Core Committee");
  if(p==="sub")renderAny("sub","subBox","Sub-Committee");
  if(p==="members")render("members","memBox","Members");
  try{history.replaceState(null,"","#"+p)}catch(e){}
}
document.getElementById("nav").addEventListener("click",e=>{const a=e.target.closest("a");if(a)show(a.dataset.p)});

function render(key,boxId,title){
  const box=document.getElementById(boxId);
  if(!role){loginView(key,box,title);return}
  const rows=store.get(key), admin=role==="ADMIN";
  box.innerHTML=`<div class="top"><h2>${title}</h2><div><span class="tag">${admin?"Admin":"Member"}</span> <button class="alt" id="out-${key}">Sign out</button></div></div>
  ${admin?`<div class="form"><input id="a-${key}" placeholder="Ad. No"><input id="n-${key}" placeholder="Name"><input id="c-${key}" placeholder="Class &amp; Div"><button id="add-${key}">Add</button></div><div class="err" id="e-${key}"></div>`:""}
  <div class="wrap"><table><thead><tr><th>Ad. No</th><th>Name</th><th>Class &amp; Div</th>${admin?"<th></th>":""}</tr></thead><tbody>
  ${rows.length?rows.map((r,i)=>`<tr><td>${esc(r.ad)}</td><td>${esc(r.name)}</td><td>${esc(r.club)}</td>${admin?`<td><button class="del" data-i="${i}">Remove</button></td>`:""}</tr>`).join(""):`<tr><td colspan="${admin?4:3}">No one added yet.${admin?" Add the first person above.":""}</td></tr>`}
  </tbody></table></div>`;
  box.querySelector("#out-"+key).onclick=()=>{role=null;try{sessionStorage.removeItem("wafdRole")}catch(e){}render(key,boxId,title)};
  if(admin){
    box.querySelector("#add-"+key).onclick=()=>{
      const ad=box.querySelector("#a-"+key).value.trim(),n=box.querySelector("#n-"+key).value.trim(),c=box.querySelector("#c-"+key).value.trim();
      if(!ad||!n||!c){box.querySelector("#e-"+key).textContent="Fill in Ad. No, Name and Class & Div.";return}
      const l=store.get(key);l.push({ad,name:n,club:c});store.set(key,l);render(key,boxId,title);
    };
    box.querySelectorAll(".del").forEach(b=>b.onclick=()=>{if(!confirm("Remove this entry? This cannot be undone."))return;const l=store.get(key);l.splice(+b.dataset.i,1);store.set(key,l);render(key,boxId,title)});
  }
}

function renderAny(key,boxId,title){key==="core"?renderCore(boxId,title):key==="gallery"?renderGallery(boxId,title):key==="sub"?renderSub(boxId,title):render(key,boxId,title)}

function renderCore(boxId,title){
  const box=document.getElementById(boxId);
  if(!role){loginView("core",box,title);return}
  const rows=store.get("core"), admin=role==="ADMIN";
  box.innerHTML=`<div class="top"><h2>${title}</h2><div><span class="tag">${admin?"Admin":"Member"}</span> <button class="alt" id="out-core">Sign out</button></div></div>
  ${admin?`<div class="form"><input id="n-core" placeholder="Name"><input id="r-core" placeholder="Role (e.g. President)"><input id="i-core" type="file" accept="image/*" aria-label="Photo"><button id="add-core">Add</button></div><div class="err" id="e-core"></div>`:""}
  <div class="people">${rows.length?rows.map((r,i)=>`<div class="person">${r.img?`<img src="${r.img}" alt="${esc(r.name)}">`:`<div class="ph">${esc(r.name.charAt(0).toUpperCase())}</div>`}<h3>${esc(r.name)}</h3><p>${esc(r.role)}</p>${admin?`<button class="del" data-i="${i}">Remove</button>`:""}</div>`).join(""):`<p>No one added yet.${admin?" Add the first person above.":""}</p>`}</div>`;
  box.querySelector("#out-core").onclick=()=>{role=null;try{sessionStorage.removeItem("wafdRole")}catch(e){}renderCore(boxId,title)};
  if(!admin)return;
  box.querySelectorAll(".del").forEach(b=>b.onclick=()=>{if(!confirm("Remove this entry? This cannot be undone."))return;const l=store.get("core");l.splice(+b.dataset.i,1);store.set("core",l);renderCore(boxId,title)});
  box.querySelector("#add-core").onclick=()=>{
    const n=box.querySelector("#n-core").value.trim(),r=box.querySelector("#r-core").value.trim(),f=box.querySelector("#i-core").files[0],err=box.querySelector("#e-core");
    if(!n||!r){err.textContent="Fill in Name and Role.";return}
    const save=img=>{const l=store.get("core");l.push({name:n,role:r,img});store.set("core",l);renderCore(boxId,title)};
    if(!f){save("");return}
    const rd=new FileReader();
    rd.onload=()=>{const im=new Image();im.onload=()=>{
      const c=document.createElement("canvas"),m=Math.min(1,400/Math.max(im.width,im.height));
      c.width=im.width*m;c.height=im.height*m;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      save(c.toDataURL("image/jpeg",.8))};
      im.onerror=()=>{err.textContent="That file is not a valid image."};im.src=rd.result};
    rd.readAsDataURL(f);
  };
}

function renderGallery(boxId,title){
  const box=document.getElementById(boxId);
  if(!role){loginView("gallery",box,title);return}
  const rows=store.get("gallery"), admin=role==="ADMIN";
  box.innerHTML=`<div class="top"><h2>${title}</h2><div><span class="tag">${admin?"Admin":"Member"}</span> <button class="alt" id="out-gal">Sign out</button></div></div>
  ${admin?`<div class="form"><input id="f-gal" type="file" accept="image/*" multiple aria-label="Photos"><button id="add-gal">Add photos</button></div><div class="err" id="e-gal"></div>`:""}
  <div class="shots">${rows.length?rows.map((r,i)=>`<div class="shot"><img src="${r}" alt="Gallery photo ${i+1}" loading="lazy">${admin?`<button class="del" data-i="${i}">Remove</button>`:""}</div>`).join(""):`<p>No photos yet.${admin?" Add the first photos above.":""}</p>`}</div>`;
  box.querySelector("#out-gal").onclick=()=>{role=null;try{sessionStorage.removeItem("wafdRole")}catch(e){}renderGallery(boxId,title)};
  if(!admin)return;
  box.querySelectorAll(".del").forEach(b=>b.onclick=()=>{if(!confirm("Remove this photo? This cannot be undone."))return;const l=store.get("gallery");l.splice(+b.dataset.i,1);store.set("gallery",l);renderGallery(boxId,title)});
  box.querySelector("#add-gal").onclick=async()=>{
    const files=[...box.querySelector("#f-gal").files],err=box.querySelector("#e-gal");
    if(!files.length){err.textContent="Choose one or more photos first.";return}
    const l=store.get("gallery");
    for(const f of files){
      try{l.push(await shrink(f,800))}catch(e){err.textContent="Skipped a file that is not a valid image."}
    }
    if(!store.set("gallery",l)){err.textContent="Storage is full. Remove some photos and try again.";return}
    renderGallery(boxId,title);
  };
}
function shrink(f,max){return new Promise((ok,no)=>{
  const rd=new FileReader();
  rd.onerror=no;
  rd.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{
    const c=document.createElement("canvas"),m=Math.min(1,max/Math.max(im.width,im.height));
    c.width=im.width*m;c.height=im.height*m;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    ok(c.toDataURL("image/jpeg",.7))};im.src=rd.result};
  rd.readAsDataURL(f)})}

const DEFAULT_HUBS=["LITERATURE HUB","INTELLECTUAL HUB","CREATIVE HUB","PUBLIC HUB"], MAX_CLUBS=4, PER_CLUB=2, HUB_MAX={"INTELLECTUAL HUB":3};
function maxClubs(h){return HUB_MAX[h]||MAX_CLUBS}
function getHubs(){const h=store.get("hubs");return h.length?h:DEFAULT_HUBS.slice()}
function renderSub(boxId,title){
  const box=document.getElementById(boxId);
  if(!role){loginView("sub",box,title);return}
  const rows=store.get("sub2"), admin=role==="ADMIN", hubs=getHubs();
  const hubHtml=hubs.map(hub=>{
    const mine=rows.map((r,i)=>({...r,i})).filter(r=>r.hub===hub);
    const line=(r,label,club)=>`<tr><td><span class="pos">${label}</span></td><td>${esc(club||"")}</td><td>${esc(r.ad)}</td><td>${esc(r.name)}</td>${admin?`<td><button class="del" data-i="${r.i}">Remove</button></td>`:""}</tr>`;
    const vac=(label)=>`<tr class="vac"><td><span class="pos">${label}</span></td><td></td><td colspan="${admin?3:2}">Vacant</td></tr>`;
    let body="";
    ["CHAIRMAN","CONVENER"].forEach(p=>{const l=mine.filter(r=>r.pos===p);body+=l.length?l.map(r=>line(r,p+" OF THE HUB","")).join(""):vac(p+" OF THE HUB")});
    const clubs=[...new Set(mine.filter(r=>r.pos==="MEMBER").map(r=>r.club))];
    clubs.forEach(c=>{
      const ms=mine.filter(r=>r.pos==="MEMBER"&&r.club===c);
      body+=`<tr class="clubrow"><td colspan="${admin?5:4}">${esc(c)}</td></tr>`;
      body+=ms.map(r=>line(r,"MEMBER",c)).join("");
      for(let n=ms.length;n<PER_CLUB;n++)body+=vac("MEMBER");
    });
    return `<div class="hub"><h3>${esc(hub)} <span class="tag">${clubs.length} of ${maxClubs(hub)} clubs</span></h3><div class="wrap"><table><thead><tr><th>Position</th><th>Club</th><th>Ad. No</th><th>Name</th>${admin?"<th></th>":""}</tr></thead><tbody>${body}</tbody></table></div></div>`;
  }).join("");
  const clubList=[...new Set(rows.filter(r=>r.pos==="MEMBER").map(r=>r.club))];
  box.innerHTML=`<div class="top"><h2>${title}</h2><div><span class="tag">${admin?"Admin":"Member"}</span> <button class="alt" id="out-sub">Sign out</button></div></div>
  ${admin?`<div class="form"><select id="h-sub" aria-label="Hub">${hubs.map(h=>`<option>${esc(h)}</option>`).join("")}</select><select id="p-sub" aria-label="Position"><option>CHAIRMAN</option><option>CONVENER</option><option>MEMBER</option></select><input id="c-sub" list="clubs-sub" placeholder="Club (for members)"><datalist id="clubs-sub">${clubList.map(n=>`<option value="${esc(n)}">`).join("")}</datalist><input id="a-sub" placeholder="Ad. No"><input id="n-sub" placeholder="Name"><button id="add-sub">Add</button></div><div class="err" id="e-sub"></div>
  <div class="hubadd"><input id="nh-sub" placeholder="New hub name"><button class="alt" id="addhub-sub">Add hub</button></div>`:""}
  ${hubHtml}`;
  box.querySelector("#out-sub").onclick=()=>{role=null;try{sessionStorage.removeItem("wafdRole")}catch(e){}renderSub(boxId,title)};
  if(!admin)return;
  box.querySelectorAll(".del").forEach(b=>b.onclick=()=>{if(!confirm("Remove this entry? This cannot be undone."))return;const l=store.get("sub2");l.splice(+b.dataset.i,1);store.set("sub2",l);renderSub(boxId,title)});
  box.querySelector("#addhub-sub").onclick=()=>{
    const n=box.querySelector("#nh-sub").value.trim().toUpperCase(),err=box.querySelector("#e-sub");
    if(!n){err.textContent="Type the new hub name.";return}
    if(hubs.includes(n)){err.textContent="That hub already exists.";return}
    store.set("hubs",[...hubs,n]);renderSub(boxId,title);
  };
  box.querySelector("#add-sub").onclick=()=>{
    const q=id=>box.querySelector("#"+id+"-sub").value.trim(),err=box.querySelector("#e-sub");
    const hub=q("h"),pos=q("p"),club=q("c"),ad=q("a"),name=q("n");
    if(!ad||!name){err.textContent="Fill in Ad. No and Name.";return}
    const l=store.get("sub2"),inHub=l.filter(r=>r.hub===hub);
    if(pos==="MEMBER"){
      if(!club){err.textContent="Type the club name for a member.";return}
      const clubs=[...new Set(inHub.filter(r=>r.pos==="MEMBER").map(r=>r.club))];
      const same=inHub.filter(r=>r.pos==="MEMBER"&&r.club.toLowerCase()===club.toLowerCase());
      if(same.length>=PER_CLUB){err.textContent=`${club} already has ${PER_CLUB} members. Remove one first.`;return}
      if(!same.length&&clubs.length>=maxClubs(hub)){err.textContent=`${hub} already has ${maxClubs(hub)} clubs. Remove a club's members first.`;return}
      l.push({hub,pos,club:same.length?same[0].club:club,ad,name});
    }else{
      if(inHub.some(r=>r.pos===pos)){err.textContent=`${hub} already has a ${pos}. Remove them first.`;return}
      l.push({hub,pos,club:"",ad,name});
    }
    store.set("sub2",l);renderSub(boxId,title);
  };
}

function loginView(key,box,title){
  let pick="MEMBERS";
  box.innerHTML=`<h2>${title} — sign in</h2><div class="box">
  <div class="row"><button class="alt on" data-r="MEMBERS">MEMBERS</button><button class="alt" data-r="ADMIN">ADMIN</button></div>
  <label for="pw-${key}">Password</label><input id="pw-${key}" type="password" autocomplete="off">
  <div class="err" id="le-${key}"></div><div class="row"><button id="go-${key}">Sign in</button></div></div>`;
  addEye(box.querySelector("#pw-"+key));
  const btns=box.querySelectorAll("[data-r]");
  btns.forEach(b=>b.onclick=()=>{pick=b.dataset.r;btns.forEach(x=>x.classList.toggle("on",x===b))});
  const go=()=>{
    if(box.querySelector("#pw-"+key).value===PASS[pick]){role=pick;try{sessionStorage.setItem("wafdRole",pick)}catch(e){}renderAny(key,box.id,title)}
    else box.querySelector("#le-"+key).textContent="Wrong password for "+pick+". Try again.";
  };
  box.querySelector("#go-"+key).onclick=go;
  box.querySelector("#pw-"+key).onkeydown=e=>{if(e.key==="Enter")go()};
}

}
document.getElementById("gbtn").onclick=tryGate;
document.getElementById("gpw").onkeydown=e=>{if(e.key==="Enter")tryGate()};
show((location.hash||"#home").slice(1).replace(/[^a-z]/g,"")||"home");
syncCloud();
